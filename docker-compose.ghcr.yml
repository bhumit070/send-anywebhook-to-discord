# Run Send Any Webhook to Discord from prebuilt images (no clone or build needed):
#   curl -LO https://raw.githubusercontent.com/bhumit070/send-anywebhook-to-discord/master/docker-compose.ghcr.yml
#   curl -L -o .env https://raw.githubusercontent.com/bhumit070/send-anywebhook-to-discord/master/.env.example
#   # set APP_SECRET and POSTGRES_PASSWORD in .env
#   docker compose -f docker-compose.ghcr.yml up -d
# Pin a release with IMAGE_TAG=1.2.3 in .env (default: latest from master).
name: send-any-webhook

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: send_any_webhook
      POSTGRES_DB: send_any_webhook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U send_any_webhook -d send_any_webhook"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/bhumit070/send-any-webhook-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://send_any_webhook:${POSTGRES_PASSWORD}@postgres:5432/send_any_webhook
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (openssl rand -hex 32)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-14}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_WORKER: ${RUN_WORKER:-true}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/bhumit070/send-any-webhook-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
