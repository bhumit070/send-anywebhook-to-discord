title: Send Any Webhook to Discord
description: Relay any webhook to a Discord channel, with a visual field mapper and full delivery logs.
url: https://bhumit070.github.io
baseurl: /send-anywebhook-to-discord

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub: https://github.com/bhumit070/send-anywebhook-to-discord
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/bhumit070/send-anywebhook-to-discord
gh_edit_branch: master
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: Send Any Webhook to Discord is MIT licensed.

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green

exclude:
  - README.md
